# Example configuration for Alfred AI Assistant
# Copy this to ~/.config/alfred/config.yaml and customize

ai:
  # Backend type: 'ollama' (local) or 'ollama_cloud' (API)
  backend: ollama
  
  # Model name (llama2, mistral, codellama, etc.)
  model: llama2
  
  # Environment variable containing API key (only for ollama_cloud)
  api_key_env: OLLAMA_CLOUD_API_KEY
  
  # Request timeout in seconds
  timeout: 30
  
  # Maximum tokens in response
  max_tokens: 2000

security:
  # Command risk levels that require user confirmation
  require_confirmation_for:
    - destructive
    - network
  
  # Directories where commands are allowed
  # Windows example:
  # allowed_command_paths:
  #   - C:\Windows\System32
  #   - C:\Windows
  #   - C:\Program Files
  
  # Linux example:
  allowed_command_paths:
    - /usr/bin
    - /usr/local/bin
    - /bin
  
  # Patterns that are always blocked (regex)
  blocked_patterns:
    - ".*rm.*-rf.*"           # Prevent rm -rf
    - ".*sudo.*"              # Block sudo
    - ".*chmod.*777.*"        # Prevent dangerous permissions
    - ".*dd.*if=.*"           # Block dd (can destroy data)
    - ".*mkfs.*"              # Block filesystem formatting
    - ".*>.*passwd.*"         # Block passwd file modifications

privacy:
  # Whether to store conversation history
  store_conversations: false
  
  # How long to keep logs (days)
  log_retention_days: 30
  
  # Whether to anonymize logs (remove user info)
  anonymize_logs: true

# Whitelisted commands
# Each command specifies:
#   path: Full path to executable
#   args_pattern: Regex pattern for allowed arguments
#   risk: safe, warning, or destructive
#   confirm: Whether to require user confirmation

commands:
  # === Safe commands (no confirmation) ===
  
  ls:
    path: /usr/bin/ls
    args_pattern: "^[a-zA-Z0-9_\\-\\./~ ]*$"
    risk: safe
    confirm: false
  
  pwd:
    path: /usr/bin/pwd
    args_pattern: "^[a-zA-Z0-9_\\-]*$"
    risk: safe
    confirm: false
  
  whoami:
    path: /usr/bin/whoami
    args_pattern: "^$"
    risk: safe
    confirm: false
  
  date:
    path: /usr/bin/date
    args_pattern: "^[a-zA-Z0-9_\\-%+: ]*$"
    risk: safe
    confirm: false
  
  uname:
    path: /usr/bin/uname
    args_pattern: "^-[a-zrsvmpio]+$"
    risk: safe
    confirm: false
  
  which:
    path: /usr/bin/which
    args_pattern: "^[a-zA-Z0-9_\\-\\./~ ]+$"
    risk: safe
    confirm: false
  
  echo:
    path: /usr/bin/echo
    args_pattern: "^[a-zA-Z0-9_\\-\\./~ !?%@]+$"
    risk: safe
    confirm: false
  
  cat:
    path: /usr/bin/cat
    args_pattern: "^[a-zA-Z0-9_\\-\\./~ ]+$"
    risk: safe
    confirm: false
  
  mkdir:
    path: /usr/bin/mkdir
    args_pattern: "^-[pvm]+$"
    risk: safe
    confirm: false
  
  touch:
    path: /usr/bin/touch
    args_pattern: "^[a-zA-Z0-9_\\-\\./~ ]+$"
    risk: safe
    confirm: false
  
  firefox:
    path: /usr/bin/firefox
    args_pattern: "^https?://[a-zA-Z0-9\\-\\._~:/?#\\[\\]@!$&'()*+,;=%]+$"
    risk: safe
    confirm: false
  
  chromium:
    path: /usr/bin/chromium
    args_pattern: "^https?://[a-zA-Z0-9\\-\\._~:/?#\\[\\]@!$&'()*+,;=%]+$"
    risk: safe
    confirm: false
  
  code:
    path: /usr/bin/code
    args_pattern: "^[a-zA-Z0-9_\\-\\./~ ]*$"
    risk: safe
    confirm: false
  
  # === Warning commands (require confirmation) ===
  
  git:
    path: /usr/bin/git
    args_pattern: "^(status|log|diff|pull|push|commit|add|checkout|branch|fetch|clone|init)\\s.*$"
    risk: warning
    confirm: true
  
  systemctl:
    path: /usr/bin/systemctl
    args_pattern: "^(start|stop|restart|status|enable|disable|reload)\\s[a-z0-9\\-.]+$"
    risk: warning
    confirm: true
  
  apt:
    path: /usr/bin/apt
    args_pattern: "^(update|upgrade|search|show|list|install)\\s[a-z0-9_\\-\\.]+$"
    risk: warning
    confirm: true
  
  pip:
    path: /usr/bin/pip
    args_pattern: "^(list|show|search|install|uninstall|freeze)\\s?[a-zA-Z0-9_\\-\\.]*$"
    risk: warning
    confirm: true
  
  npm:
    path: /usr/bin/npm
    args_pattern: "^(list|search|view|install|uninstall|outdated)\\s?[a-zA-Z0-9_\\-\\.]*$"
    risk: warning
    confirm: true
  
  cargo:
    path: /usr/bin/cargo
    args_pattern: "^(build|run|test|check|doc|search|binary)\\s?[a-zA-Z0-9_\\-\\.]*$"
    risk: warning
    confirm: true
  
  find:
    path: /usr/bin/find
    args_pattern: "^[a-zA-Z0-9_\\-\\./~ ]+$"
    risk: warning
    confirm: true
  
  grep:
    path: /usr/bin/grep
    args_pattern: "^[a-zA-Z0-9_\\-\\./~ ]+$"
    risk: warning
    confirm: true
  
  # === Destructive commands (require confirmation) ===
  
  rm:
    path: /usr/bin/rm
    args_pattern: "^-[rfiI]+$"
    risk: destructive
    confirm: true
  
  rmdir:
    path: /usr/bin/rmdir
    args_pattern: "^[a-zA-Z0-9_\\-\\./~ ]+$"
    risk: destructive
    confirm: true
  
  cp:
    path: /usr/bin/cp
    args_pattern: "^-[irp]+$"
    risk: destructive
    confirm: true
  
  mv:
    path: /usr/bin/mv
    args_pattern: "^-[fiIu]+$"
    risk: destructive
    confirm: true
  
  # shutdown and reboot are blocked - too dangerous for whitelisting

